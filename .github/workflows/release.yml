name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Debug build (push / PR)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Decode keystore
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MotionSentinel-${GITHUB_REF_NAME#v}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
